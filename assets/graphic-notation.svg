<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Hand-drawn graphic notation">
  <defs>
    <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#f6f0e2"></rect>
      <circle cx="3" cy="3" r="0.6" fill="#dcd2bb" opacity=".5"></circle>
      <circle cx="14" cy="11" r="0.5" fill="#dcd2bb" opacity=".4"></circle>
    </pattern>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="2.5" numOctaves="2" seed="3"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="0.9"></feDisplacementMap>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#paper)"></rect>
  
  <rect width="800" height="450" fill="none" stroke="#b89f6e" stroke-width="3" opacity=".25"></rect>

  <g filter="url(#rough)" stroke="#1f1a14" fill="none" stroke-linecap="round" stroke-linejoin="round">

    
    <g stroke-width="2.4">
      <path d="M50 340 Q 80 300, 110 320 T 170 300 T 230 280"></path>
      <path d="M55 360 Q 85 320, 115 345 T 180 325"></path>
      <path d="M60 380 Q 90 345, 120 365"></path>
    </g>
    <text x="55" y="405" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#1f1a14" filter="none">trem. ↗</text>

    
    <g stroke-width="3" transform="translate(330 200)">
      <path d="M0 0&#xA;               m 0,-12&#xA;               a 12,12 0 1,1 0,24&#xA;               a 12,12 0 1,1 0,-24&#xA;               m 0,-26&#xA;               a 26,26 0 1,1 0,52&#xA;               a 26,26 0 1,1 0,-52&#xA;               m 0,-44&#xA;               a 44,44 0 1,1 0,88&#xA;               a 44,44 0 1,1 0,-88&#xA;               m 0,-66&#xA;               a 66,66 0 1,1 0,132&#xA;               a 66,66 0 1,1 0,-132"></path>
    </g>
    <text x="285" y="305" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#1f1a14" filter="none">crescendo</text>

    
    <g stroke-width="3">
      <path d="M180 200 Q 280 100, 430 200 T 720 200"></path>
      <path d="M705 188 L 730 200 L 705 213"></path>
    </g>

    
    <g fill="#1f1a14" stroke="none" filter="none">
      <circle cx="540" cy="80" r="4"></circle>
      <circle cx="558" cy="95" r="4"></circle>
      <circle cx="572" cy="78" r="4"></circle>
      <circle cx="600" cy="92" r="4"></circle>
      <circle cx="618" cy="74" r="4"></circle>
      <circle cx="640" cy="98" r="4"></circle>
      <circle cx="668" cy="80" r="4"></circle>
    </g>
    <text x="540" y="135" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1f1a14" filter="none">pizz. cluster</text>

    
    <g stroke-width="2.8">
      <path d="M540 330 L 555 310 L 570 330 L 585 310 L 600 330 L 615 310 L 630 330 L 645 310 L 660 330 L 675 310 L 690 330 L 705 310 L 720 330"></path>
    </g>
    <text x="555" y="370" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1f1a14" filter="none">↯ scrape across</text>

    
    <text x="35" y="60" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#1f1a14" filter="none">for 3 voices &amp; one object</text>

    
    <g stroke="#a06b3a" stroke-dasharray="3 6" stroke-width="1.5" filter="none">
      <line x1="60" y1="80" x2="60" y2="420"></line>
      <line x1="260" y1="80" x2="260" y2="420"></line>
      <line x1="470" y1="80" x2="470" y2="420"></line>
      <line x1="680" y1="80" x2="680" y2="420"></line>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#a06b3a" filter="none">
      <text x="50" y="430">0:00</text>
      <text x="250" y="430">0:20</text>
      <text x="460" y="430">0:40</text>
      <text x="670" y="430">1:00</text>
    </g>
  </g>
</svg>
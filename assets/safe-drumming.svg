<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Safe drumming technique: musician&#39;s ear plugs and a hand demonstrating matched grip at the stick&#39;s balance point.">
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f0e2"></stop>
      <stop offset="100%" stop-color="#ece3cb"></stop>
    </linearGradient>
    <radialGradient id="skin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f1c599"></stop>
      <stop offset="100%" stop-color="#c08a5a"></stop>
    </radialGradient>
    <linearGradient id="stickWood" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d6a874"></stop>
      <stop offset="50%" stop-color="#b88149"></stop>
      <stop offset="100%" stop-color="#8b5a2b"></stop>
    </linearGradient>
    <linearGradient id="plug" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4b88a"></stop>
      <stop offset="100%" stop-color="#b56a3f"></stop>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"></rect>

  
  <g>
    <rect x="20" y="18" width="240" height="32" rx="16" fill="#1f1a14"></rect>
    <text x="38" y="39" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#f6f0e2" font-weight="700">SAFE DRUMMING TECHNIQUE</text>
  </g>

  
  <line x1="400" y1="80" x2="400" y2="420" stroke="#c4b58a" stroke-dasharray="4 6" stroke-width="2"></line>

  
  <g>
    <text x="60" y="100" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1f1a14" font-weight="700">1 · Protect your ears</text>
    <text x="60" y="124" font-family="Georgia, serif" font-size="13" fill="#5a3d08">Drums are louder than safe.</text>
    <text x="60" y="142" font-family="Georgia, serif" font-size="13" fill="#5a3d08">Damage is permanent.</text>

    
    <g transform="translate(220 250)">
      
      <path d="M -120 -100&#xA;               q -10 -80, 60 -110&#xA;               q 90 -38, 130 30&#xA;               q 22 40, 20 90&#xA;               q -2 60, -50 86&#xA;               q -52 26, -110 4&#xA;               q -56 -22, -50 -100 z" fill="url(#skin)" stroke="#6e4322" stroke-width="2"></path>
      
      <path d="M -110 -130 q 0 -50, 70 -65 q 90 -16, 120 35 q -40 -22, -110 -5 q -50 12, -80 35 z" fill="#3a2a1c"></path>
      
      <ellipse cx="-30" cy="-30" rx="6" ry="3" fill="#1f1a14"></ellipse>
      
      <path d="M -52 -25 q -10 22, 0 30" fill="none" stroke="#6e4322" stroke-width="1.5"></path>
      
      <path d="M -50 26 q 8 6, 22 0" fill="none" stroke="#6e4322" stroke-width="1.5"></path>

      
      <g transform="translate(58 -10)">
        <path d="M 0 0 q 22 -6, 24 22 q 0 28, -16 32 q -10 4, -14 -10 q -2 -22, 6 -44 z" fill="#e1a274" stroke="#6e4322" stroke-width="1.8"></path>
        <path d="M 6 8 q 10 0, 12 16 q 0 16, -8 18" fill="none" stroke="#a06038" stroke-width="1.5"></path>
        
        <ellipse cx="10" cy="14" rx="9" ry="11" fill="url(#plug)" stroke="#6a3a18" stroke-width="1.5"></ellipse>
        
        <path d="M 4 8 q 12 0, 14 4" fill="none" stroke="#7a4422" stroke-width="1"></path>
        <path d="M 3 14 q 14 0, 16 4" fill="none" stroke="#7a4422" stroke-width="1"></path>
        <path d="M 4 20 q 12 0, 14 4" fill="none" stroke="#7a4422" stroke-width="1"></path>
        
        <line x1="30" y1="14" x2="100" y2="-30" stroke="#1f1a14" stroke-width="1.5"></line>
        <circle cx="100" cy="-30" r="3" fill="#1f1a14"></circle>
      </g>

      
      <g transform="translate(95 -85)">
        <rect x="0" y="0" width="120" height="60" rx="10" fill="#fff" stroke="#1f1a14" stroke-width="1.5"></rect>
        <text x="60" y="22" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="14" fill="#1f1a14">Musician&#39;s</text>
        <text x="60" y="42" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="14" fill="#1f1a14">ear plug</text>
      </g>
    </g>

    
    <g stroke="#c44a3a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".75">
      <path d="M 50 230 q 12 -14, 0 -28"></path>
      <path d="M 38 230 q 22 -22, 0 -44"></path>
      <path d="M 26 230 q 32 -30, 0 -60"></path>
    </g>
    <text x="22" y="290" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#c44a3a" font-weight="700">110 dB</text>

    
    <g transform="translate(50 380)">
      <rect x="0" y="0" width="300" height="40" rx="20" fill="#c44a3a"></rect>
      <text x="150" y="26" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="14" fill="#fff">Plugs at every rehearsal. No exceptions.</text>
    </g>
  </g>

  
  <g>
    <text x="430" y="100" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1f1a14" font-weight="700">2 · Matched grip</text>
    <text x="430" y="124" font-family="Georgia, serif" font-size="13" fill="#5a3d08">Hold at the balance point.</text>
    <text x="430" y="142" font-family="Georgia, serif" font-size="13" fill="#5a3d08">Relax your fingers and let it bounce.</text>

    
    <g transform="translate(580 280) rotate(-22)">
      
      <rect x="-160" y="-7" width="320" height="14" rx="7" fill="url(#stickWood)" stroke="#6e4422" stroke-width="1.5"></rect>
      
      <ellipse cx="160" cy="0" rx="14" ry="10" fill="#a87144" stroke="#6e4422" stroke-width="1.5"></ellipse>
      
      <g transform="translate(-60 0)">
        <circle cx="0" cy="0" r="22" fill="#fff" stroke="#c44a3a" stroke-width="2.5" stroke-dasharray="3 3"></circle>
      </g>

      
      <g transform="translate(-60 0)">
        
        <ellipse cx="0" cy="2" rx="46" ry="32" fill="url(#skin)" stroke="#6e4322" stroke-width="1.8"></ellipse>
        
        <path d="M -30 -28 q 20 -22, 50 -10 q 8 8, -2 22 q -16 6, -50 -4 z" fill="url(#skin)" stroke="#6e4322" stroke-width="1.8"></path>
        
        <g fill="url(#skin)" stroke="#6e4322" stroke-width="1.6">
          <path d="M -36 6 q -8 16, 6 26 q 14 6, 18 -6 q 2 -8, -4 -22 z"></path>
          <path d="M -18 10 q -6 18, 8 28 q 14 4, 16 -8 q 2 -8, -6 -22 z"></path>
          <path d="M  4 10 q  -2 18, 10 26 q 12 2, 14 -10 q 2 -8, -6 -22 z"></path>
          <path d="M 22 8  q  4 16, 14 22 q 10 0, 10 -10 q 0 -10, -8 -20 z"></path>
        </g>
        
        <rect x="-58" y="14" width="60" height="40" rx="14" fill="url(#skin)" stroke="#6e4322" stroke-width="1.8" transform="rotate(22 -28 34)"></rect>
      </g>
    </g>

    
    <g transform="translate(440 220)">
      <line x1="0" y1="0" x2="80" y2="50" stroke="#c44a3a" stroke-width="1.5"></line>
      <circle cx="80" cy="50" r="3" fill="#c44a3a"></circle>
      <rect x="-110" y="-22" width="138" height="36" rx="10" fill="#fff" stroke="#c44a3a" stroke-width="1.5"></rect>
      <text x="-41" y="-3" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#c44a3a" font-weight="700">BALANCE POINT</text>
      <text x="-41" y="10" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#1f1a14">≈ ⅓ from the butt</text>
    </g>

    
    <g stroke="#1f6f5b" stroke-width="2" fill="none" stroke-linecap="round" opacity=".75">
      <path d="M 750 245 q -10 -22, 0 -50"></path>
      <path d="M 745 195 l -6 8 l 12 0 z" fill="#1f6f5b"></path>
      <path d="M 750 245 q -10 22, 0 50"></path>
      <path d="M 745 295 l -6 -8 l 12 0 z" fill="#1f6f5b"></path>
    </g>
    <text x="700" y="170" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#1f6f5b">let it bounce</text>

    
    <g transform="translate(450 380)">
      <rect x="0" y="0" width="300" height="40" rx="20" fill="#1f6f5b"></rect>
      <text x="150" y="26" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="14" fill="#fff">Both hands the same. Knees just above hip height.</text>
    </g>
  </g>
</svg>
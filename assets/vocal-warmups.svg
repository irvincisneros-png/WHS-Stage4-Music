<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Vocal warm-up exercises: lip trill, sirens, yawn-sigh, humming, vowel shapes, with a singer in good posture.">
  <defs>
    <linearGradient id="bg3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f0e2"></stop>
      <stop offset="100%" stop-color="#ece3cb"></stop>
    </linearGradient>
    <radialGradient id="skinV" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f1c599"></stop>
      <stop offset="100%" stop-color="#c08a5a"></stop>
    </radialGradient>
    <radialGradient id="dot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c44a3a"></stop>
      <stop offset="100%" stop-color="#7c1f12"></stop>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"></rect>

  
  <g>
    <rect x="20" y="18" width="220" height="32" rx="16" fill="#1f1a14"></rect>
    <text x="38" y="39" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#f6f0e2" font-weight="700">VOCAL WARM-UPS · 5 MIN</text>
  </g>
  <text x="540" y="40" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#5a3d08">Do these before any rehearsal.</text>

  
  <g transform="translate(60 90)">
    
    <ellipse cx="80" cy="48" rx="48" ry="56" fill="url(#skinV)" stroke="#6e4322" stroke-width="2"></ellipse>
    
    <path d="M 32 22 q 8 -28, 50 -26 q 44 0, 50 24 q -22 -10, -50 -6 q -28 4, -50 8 z" fill="#3a2a1c"></path>
    
    <path d="M 60 44 q 8 4, 18 0" fill="none" stroke="#1f1a14" stroke-width="2" stroke-linecap="round"></path>
    <path d="M 96 44 q 8 4, 18 0" fill="none" stroke="#1f1a14" stroke-width="2" stroke-linecap="round"></path>
    
    <path d="M 80 55 q -3 12, 4 18" fill="none" stroke="#6e4322" stroke-width="1.5"></path>
    
    <ellipse cx="80" cy="84" rx="10" ry="14" fill="#5a1c14"></ellipse>
    <ellipse cx="80" cy="88" rx="6" ry="4" fill="#2a0c08"></ellipse>

    
    <rect x="64" y="100" width="32" height="22" fill="url(#skinV)" stroke="#6e4322" stroke-width="2"></rect>
    
    <path d="M 20 130 q 60 -22, 120 0 l -10 100 q -50 14, -100 0 z" fill="#1f6f5b" stroke="#0e3e30" stroke-width="2"></path>
    
    <ellipse cx="80" cy="180" rx="42" ry="22" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 4" opacity=".8"></ellipse>
    <text x="80" y="184" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#fff" font-weight="700">RIB CAGE</text>

    
    <g font-family="Georgia, serif" font-style="italic" font-size="12" fill="#5a3d08">
      
      <line x1="80" y1="-12" x2="80" y2="-6" stroke="#c44a3a" stroke-width="1.5"></line>
      <circle cx="80" cy="-12" r="3" fill="#c44a3a"></circle>
      <text x="80" y="-22" text-anchor="middle" fill="#c44a3a" font-weight="700">tall crown ↑</text>
      
      <line x1="135" y1="80" x2="170" y2="80" stroke="#c44a3a" stroke-width="1.5"></line>
      <text x="172" y="76">soft jaw</text>
      
      <line x1="160" y1="140" x2="195" y2="140" stroke="#c44a3a" stroke-width="1.5"></line>
      <text x="200" y="136">low shoulders</text>
      
      <line x1="160" y1="220" x2="195" y2="220" stroke="#c44a3a" stroke-width="1.5"></line>
      <text x="200" y="216">belly breath</text>
    </g>

    
    <line x1="-10" y1="262" x2="240" y2="262" stroke="#1f1a14" stroke-width="1" stroke-dasharray="2 3"></line>
    <text x="-6" y="278" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5a3d08">feet flat · weight even</text>
  </g>

  
  

  
  <g transform="translate(340 90)">
    <rect width="200" height="120" rx="14" fill="#fff" stroke="#dcd2bb" stroke-width="1.5"></rect>
    <text x="16" y="32" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#c44a3a">1 · Lip trill</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="12" fill="#5a3d08">Loose lips. Bbbrrrrr.</text>
    <text x="16" y="68" font-family="Georgia, serif" font-size="12" fill="#5a3d08">Slide up and down slowly.</text>
    
    <g transform="translate(150 80)">
      <path d="M -22 0 q 10 -10, 22 0 q 10 -10, 22 0" fill="none" stroke="#c44a3a" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M -22 6 q 10 10, 22 0 q 10 10, 22 0" fill="none" stroke="#c44a3a" stroke-width="2.5" stroke-linecap="round"></path>
      <g stroke="#c44a3a" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7">
        <line x1="32" y1="-8" x2="42" y2="-12"></line>
        <line x1="34" y1="0" x2="46" y2="0"></line>
        <line x1="32" y1="10" x2="42" y2="14"></line>
      </g>
    </g>
    <text x="16" y="105" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#7a6840" font-weight="700">30 SEC</text>
  </g>

  
  <g transform="translate(560 90)">
    <rect width="200" height="120" rx="14" fill="#fff" stroke="#dcd2bb" stroke-width="1.5"></rect>
    <text x="16" y="32" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#1f6f5b">2 · Sirens</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="12" fill="#5a3d08">&#34;Ng&#34; or &#34;ooo&#34;.</text>
    <text x="16" y="68" font-family="Georgia, serif" font-size="12" fill="#5a3d08">Slide low → high → low.</text>
    
    <g transform="translate(20 80)">
      <path d="M 0 30 Q 70 -10, 140 30 Q 175 50, 175 30" fill="none" stroke="#1f6f5b" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="0" cy="30" r="4" fill="#1f6f5b"></circle>
      <circle cx="70" cy="6" r="4" fill="#1f6f5b"></circle>
      <circle cx="140" cy="30" r="4" fill="#1f6f5b"></circle>
      <text x="0" y="50" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#1f6f5b">low</text>
      <text x="60" y="-2" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#1f6f5b">high</text>
      <text x="130" y="50" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#1f6f5b">low</text>
    </g>
  </g>

  
  <g transform="translate(340 220)">
    <rect width="200" height="120" rx="14" fill="#fff" stroke="#dcd2bb" stroke-width="1.5"></rect>
    <text x="16" y="32" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#7c4a7e">3 · Yawn-sigh</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="12" fill="#5a3d08">Open mouth wide, yawn,</text>
    <text x="16" y="68" font-family="Georgia, serif" font-size="12" fill="#5a3d08">then sigh on &#34;haaaa&#34;.</text>
    
    <g transform="translate(20 90)">
      <path d="M 0 0 Q 60 5, 160 22" fill="none" stroke="#7c4a7e" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="0" cy="0" r="4" fill="#7c4a7e"></circle>
      <text x="6" y="-4" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#7c4a7e" font-weight="700">haaa…</text>
    </g>
  </g>

  
  <g transform="translate(560 220)">
    <rect width="200" height="120" rx="14" fill="#fff" stroke="#dcd2bb" stroke-width="1.5"></rect>
    <text x="16" y="32" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#b8761c">4 · Humming</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="12" fill="#5a3d08">Lips closed. Mmmmm.</text>
    <text x="16" y="68" font-family="Georgia, serif" font-size="12" fill="#5a3d08">Feel a buzz on the nose.</text>
    
    <g transform="translate(140 80)">
      <circle cx="0" cy="0" r="22" fill="#f1c599" stroke="#6e4322" stroke-width="1.5"></circle>
      <path d="M -10 -8 q 4 4, 0 8" stroke="#1f1a14" stroke-width="2" fill="none" stroke-linecap="round"></path>
      <path d="M 10 -8 q -4 4, 0 8" stroke="#1f1a14" stroke-width="2" fill="none" stroke-linecap="round"></path>
      <path d="M -8 8 q 8 4, 16 0" stroke="#b8761c" stroke-width="2" fill="none" stroke-linecap="round"></path>
      
      <g stroke="#b8761c" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8">
        <path d="M 25 -4 q 6 6, 0 12"></path>
        <path d="M 33 -8 q 12 10, 0 20"></path>
      </g>
    </g>
  </g>

  
  <g transform="translate(340 350)">
    <rect width="200" height="120" rx="14" fill="#fff" stroke="#dcd2bb" stroke-width="1.5"></rect>
    <text x="16" y="32" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#c44a3a">5 · Vowel shapes</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="12" fill="#5a3d08">Mee · May · Mah · Moh · Moo</text>
    
    <g transform="translate(14 86)">
      <g>
        <ellipse cx="0" cy="0" rx="8" ry="3" fill="#5a1c14"></ellipse>
        <text x="0" y="22" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f1a14">Mee</text>
      </g>
      <g transform="translate(38 0)">
        <ellipse cx="0" cy="0" rx="9" ry="5" fill="#5a1c14"></ellipse>
        <text x="0" y="22" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f1a14">May</text>
      </g>
      <g transform="translate(76 0)">
        <ellipse cx="0" cy="0" rx="9" ry="9" fill="#5a1c14"></ellipse>
        <text x="0" y="26" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f1a14">Mah</text>
      </g>
      <g transform="translate(114 0)">
        <ellipse cx="0" cy="0" rx="8" ry="8" fill="#5a1c14"></ellipse>
        <text x="0" y="24" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f1a14">Moh</text>
      </g>
      <g transform="translate(152 0)">
        <ellipse cx="0" cy="0" rx="6" ry="7" fill="#5a1c14"></ellipse>
        <text x="0" y="24" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f1a14">Moo</text>
      </g>
    </g>
  </g>

  
  <g transform="translate(560 350)">
    <rect width="200" height="120" rx="14" fill="#1f1a14"></rect>
    <text x="16" y="32" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#f6f0e2">6 · Box breath</text>
    <text x="16" y="52" font-family="Georgia, serif" font-size="12" fill="#dcd2bb">In for 4. Out for 8.</text>
    <text x="16" y="68" font-family="Georgia, serif" font-size="12" fill="#dcd2bb">Use the timer below.</text>
    
    <g transform="translate(140 80)">
      <circle cx="0" cy="0" r="22" fill="#c44a3a"></circle>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#fff">4</text>
    </g>
  </g>
</svg>